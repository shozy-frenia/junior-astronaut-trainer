<!-- Built for the NASA Space Apps Challenge 2026 by team Nabeghlavi, with AI assistance (Anthropic Claude) for code, the Kip and base-scene drawings, and text drafts.
     All NASA and CSA data is real; every value in data.js carries its source URL and retrieval date. -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<div id="gloss" role="status"></div>

<script src="data.js"></script>
<script>
/* =====================================================================
   ENGINE: pure functions. State in -> new state out. No DOM, no globals.
   [T] = tuned for game balance only. [R] = real, read from data.js.
   ===================================================================== */
/* ENGINE:START */
function createEngine(data) {
  'use strict';

  /* ---------- tuning ---------- */
  var TUNING = {
    sols: 30, crew: 2, handSize: 3,                                   // [T]
    start: { ls: 80, power: 60, shield: 20 },                         // [T] 30 sols x 0.67 = 20.1 mSv: without shielding the budget runs out
    max:   { ls: 100, power: 100, shield: 20 },                       // [T]
    lsPerSol: 5, solarPerSol: 30, baseUsePerSol: 20, cleanPanelBonus: 10, // [T]
    dose: data.mars.radiation.surfaceGcrDose.value,                   // [R] 0.67 mSv/day, Curiosity RAD at Gale crater
    doseWithRoof: 0.5,                                                // [T]
    warn: { low: 0.35, danger: 0.2 },                                 // [T] bar turns amber under 35%, red under 20%
    stormHit: 4, forbushFactor: 0.7, forbushSols: 2,                  // [T]
    stormMult: { roof: 0.7, shelter: 0.3, wall: 0.2 },                // [T]
    flareStormChance: { X: 0.5, M: 0.25, C: 0 },                      // [T]
    cmeMinSpeed: 1000, glancingFactor: 0.5,                           // [T] only fast CMEs (1000 km/s+, same cut as data.js) that DONKI models as hitting Mars
    stormCap: 3, stormGap: 3,                                         // [T] max storms per run, min sols between storms
    dust: { earliest: 5, latest: 22, length: 3, solarFactor: 0.5 },   // [T]
    failures: { min: 1, max: 2, earliest: 3, latest: 26, recyclerExtraLs: 5, panelPower: 10 }, // [T]
    conjunctionSols: 4,                                               // [T] (real one lasted about 2.5 weeks)
    goals: { stars: 3, harvests: 5, shieldFor3Stars: 4 },             // [T] was 5; with Shield 20 that was almost unreachable
    levels: { cadet: { lsPerSol: 3 }, commander: {} }                 // [T] Cadet: air drains slower, for first missions (balance.js --level cadet)
  };
  function tuned(s, k) { var o = TUNING.levels[s.level] || {}; return k in o ? o[k] : TUNING[k]; }   // a level's value, else the default

  /* ---------- small helpers ---------- */
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function r2(x) { return Math.round(x * 100) / 100; }
  function r1(x) { return Math.round(x * 10) / 10; }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
  function rnd(s) {                                  // mulberry32; mutates the working copy's s.rng
    s.rng = (s.rng + 0x6D2B79F5) >>> 0;
    var t = s.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rint(s, lo, hi) { return lo + Math.floor(rnd(s) * (hi - lo + 1)); }
  function shuffle(s, arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) { j = Math.floor(rnd(s) * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function dayMs(iso) { return Date.parse(iso + 'T00:00:00Z'); }
  function addDays(iso, n) { return new Date(dayMs(iso) + n * 864e5).toISOString().slice(0, 10); }
  function diffDays(a, b) { return Math.round((dayMs(b) - dayMs(a)) / 864e5); }
  function dateOf(iso) { return String(iso).slice(0, 10); }

  /* ---------- real data indexes (built once per engine) ---------- */
  var CLASS_RANK = { C: 1, M: 2, X: 3 };
  function flareRank(f) { return CLASS_RANK[f.letter] * 1000 + parseFloat(f.value.slice(1)); }

  function isModel(sep) { return /^MODEL/.test(sep.value); }
  function detectorWords(label) {                    // plain words for a DONKI detector name
    if (/^GOES/.test(label)) { return { who: 'the GOES weather satellite', where: 'near Earth' }; }
    if (/^SOHO/.test(label)) { return { who: 'the SOHO solar observatory', where: 'near Earth' }; }
    if (/^STEREO/.test(label)) { return { who: 'the STEREO-A spacecraft', where: "in space near Earth's orbit" }; }
    if (/ACE/.test(label)) { return { who: 'the ACE spacecraft', where: 'near Earth' }; }
    return { who: label, where: 'near Earth' };
  }

  var idx = (function () {
    var flares = {}, seps = {}, cmes = {};
    data.donki.flares.forEach(function (f) {
      var d = dateOf(f.date);
      if (!flares[d] || flareRank(f) > flareRank(flares[d])) { flares[d] = f; }   // strongest flare of the day
    });
    data.donki.seps.forEach(function (e) {
      var d = dateOf(e.date);
      if (!seps[d] || (isModel(seps[d]) && !isModel(e))) { seps[d] = e; }          // prefer a real detector over a MODEL forecast
    });
    data.donki.cmes.forEach(function (c) {
      if (!c.marsArrivalEstimate || c.value < TUNING.cmeMinSpeed) { return; }       // only CMEs DONKI models as reaching Mars
      var d = dateOf(c.marsArrivalEstimate);
      if (!cmes[d] || c.value > cmes[d].value) { cmes[d] = c; }
    });
    return { flares: flares, seps: seps, cmes: cmes };
  })();

  var conjRange = (function () {
    var m = /(\d{4}-\d{2}-\d{2}) to (\d{4}-\d{2}-\d{2})/.exec(data.anchors.solarConjunction2026.nasaMaven.value);
    return m ? { start: m[1], end: m[2] } : null;
  })();

  /* ---------- where each fact came from: live DONKI feed or a saved copy ---------- */
  var LIVE = data.meta.mode === 'live';
  function replayNote() { return LIVE ? 'Fetched live from NASA on ' + data.meta.fetched + ', replayed as a game day.' : 'Replayed, not live.'; }
  function an(cls) { return /^[MX]/.test(cls) ? 'an ' : 'a '; }               // "an M3.5 flare", "a C2.0 flare"
  function whenText(iso) { return String(iso).slice(0, 10) + ' ' + String(iso).slice(11, 16) + ' UTC'; }
  function fromFeed(name, url, note) {               // a DONKI row: live if the live fetch worked, else the archive
    return { name: name, url: url || '', note: note, live: LIVE, retrieved: LIVE ? data.meta.fetched : data.meta.retrieved };
  }
  function fromCopy(e, note) {                       // any other data.js entry: always a saved copy
    return { name: e.source, url: e.url, note: note || '', live: false, retrieved: e.retrieved };
  }
  function fact(e, text, note) {                     // anchor shown on a card
    return { text: text, url: e.url, source: fromCopy(e, note || 'The fact is real. The numbers on the card are game numbers.') };
  }

  function lightMin(date) {                          // [R] JPL Horizons, one-way minutes, linear between 10-day samples
    var smp = data.earthMars.sampleEvery10Days, t = diffDays(smp[0].date, date) / 10;
    if (t <= 0) { return smp[0].value; }
    var i = Math.floor(t);
    if (i >= smp.length - 1) { return smp[smp.length - 1].value; }
    return r1(smp[i].value + (smp[i + 1].value - smp[i].value) * (t - i));
  }

  /* ---------- cards ([T] amounts; anchors are real, from data.js) ---------- */
  function ev(s) { return s.schedule[s.sol - 1]; }
  var CARDS = [
    { id: 'recycler', icon: 'recycle', name: 'Recycler overtime', text: 'Run the air and water cleaner extra hard.',
      cost: { power: 10 }, gain: { ls: 10 },
      anchor: function () { var a = data.anchors.issWater.recovery; return fact(a, a.kid); } },
    { id: 'moxie', icon: 'o2', name: 'MOXIE oxygen maker', text: 'Make oxygen out of Mars air.',
      cost: { power: 15 }, gain: { ls: 12 },
      anchor: function () { var a = data.anchors.moxie.oxygenTotal; return fact(a, a.kid); } },
    { id: 'grow', icon: 'sprout', name: 'Grow food', text: 'Tend the greenhouse and pick a harvest.',
      cost: { power: 10, ls: 5 }, gain: {}, extraGain: '+1 harvest, and +3% Life Support next sol',
      fx: function (s) { s.harvests += 1; s.bonusNext += 3; return 'Harvest picked! The plants will make a little extra air next sol.'; },
      anchor: function () { var a = data.csaFood[3]; return fact(a.fact, a.kid); } },
    { id: 'wall', icon: 'drop', name: 'Water wall', text: 'Stack water tanks around the sleeping area. Water blocks space rays.',
      cost: { ls: 15 }, gain: {}, extraGain: 'next particle storm hurts 80% less',
      ok: function (s) { return !s.wallArmed; },
      fx: function (s) { s.wallArmed = true; return 'Water wall is ready for the next particle storm.'; },
      anchor: function () { var a = data.anchors.shieldWater; return fact(a, a.kid); } },
    { id: 'roof', icon: 'bricks', name: 'Dirt roof', text: 'Pile Mars soil on the roof as a radiation shield.',
      cost: { power: 20 }, gain: {}, extraGain: 'daily dose drops to 0.50 mSv. Storms hurt 30% less. Lasts all mission.',
      ok: function (s) { return !s.roofBuilt; },
      fx: function (s) { s.roofBuilt = true; return 'Soil roof built. Every day from now on takes in less radiation.'; },
      anchor: function () { var a = data.anchors.shieldSoil; return fact(a, a.kid); } },
    { id: 'shelter', icon: 'shelter', name: 'Storm shelter', text: 'Hide in the safest room until the storm passes.',
      cost: { power: 8 }, extraCost: 'next sol you play only 1 card', gain: {}, extraGain: "today's storm hurts 70% less",
      ok: function (s) { return !!ev(s).storm && !s.shelterToday; },
      fx: function (s) { s.shelterToday = true; s.lostActionNext = 1; return 'The crew is in the shelter. Tomorrow you only get to play 1 card.'; },
      anchor: function () { var a = data.anchors.stormShelter; return fact(a, a.kid); } },
    { id: 'rock', icon: 'rock', name: 'Rock-sample walk', text: 'Walk out and collect a rock sample.',
      cost: { ls: 5, power: 5 }, gain: {}, extraGain: '+1 science star',
      fx: function (s) { s.stars += 1; return 'Rock sample collected: +1 science star.'; },
      anchor: function () { var a = data.anchors.sampleTubes; return fact(a, a.kid); } },
    { id: 'clean', icon: 'brush', name: 'Clean solar panels', text: 'Brush the dust off the solar panels.',
      cost: { ls: 5 }, gain: {}, extraGain: '+10 kWh every sol until the next dust storm',
      ok: function (s) { return !s.panelsClean; },
      fx: function (s) { s.panelsClean = true; return 'Panels are shiny. More power every sol (until dust comes back).'; },
      anchor: function () { var a = data.anchors.opportunity.dustTau; return fact(a, a.kid); } },
    { id: 'call', icon: 'dish', name: 'Call Earth', text: 'Ask Mission Control what is coming. Radio messages need time to travel.',
      cost: { power: 5 }, gain: {}, extraGain: "see the next 2 sols' events",   // [T] the radio uses power
      ok: function (s) { return s.sol < TUNING.sols; },                                                                          // never dealt on the last sol
      fx: function (s) {
        var d = ev(s).light, sols = [];
        if (s.sol + 1 <= TUNING.sols) { sols.push(s.sol + 1); }
        if (s.sol + 2 <= TUNING.sols) { sols.push(s.sol + 2); }
        s.forecast = { made: s.sol, sols: sols };
        return 'Radio delay today: ' + d + ' minutes one way. The answer took about ' + r1(d * 2) + ' minutes. Earth sent a forecast.';
      },
      anchor: function () {
        var a = data.earthMars.lightMinutes.min;
        return fact(a, data.glossary.lightMinutes, 'Real: NASA JPL Horizons gives the Earth-Mars distance for every day. The delay on the card comes from it.');
      } },
    { id: 'fixit', icon: 'wrench', name: 'Fix-it (3D-print a part)', text: 'Print a new part and repair something broken.',
      cost: { power: 10 }, gain: {}, extraGain: 'fixes 1 broken machine',
      ok: function (s) { return s.failures.length > 0; },
      fx: function (s) { var f = s.failures.shift(); return f === 'recycler' ? 'The recycler works again.' : 'The solar panel string works again.'; },
      anchor: function () { var a = data.anchors.printedPart; return fact(a, a.kid); } },
    { id: 'lab', icon: 'flask', name: 'Lab experiment', text: 'Run a science experiment and learn a real space fact.',
      cost: { power: 10 }, gain: {}, extraGain: '+1 science star and 1 real fact',
      fx: function (s) {
        var f = data.osdr[s.labCount % data.osdr.length];
        s.labCount += 1; s.stars += 1;
        return { text: 'Science star! ' + f.kid, url: f.evidence.url, tip: f.studyId + '; ' + f.subject,
                 name: f.evidence.source, retrieved: f.evidence.retrieved, note: f.studyId + '. Subject: ' + f.subject + '.' };
      } },
    { id: 'psave', icon: 'moon', name: 'Power-save night', text: 'Slow the machines down overnight.',
      cost: { ls: 5 }, gain: { power: 10 }, extraCost: 'the recycler runs slowly' }
  ];
  var byId = {};
  CARDS.forEach(function (c) { byId[c.id] = c; });

  function costText(c) {
    var p = [];
    if (c.cost.power) { p.push('−' + c.cost.power + ' kWh'); }
    if (c.cost.ls) { p.push('−' + c.cost.ls + '% Life Support'); }
    if (c.extraCost) { p.push(c.extraCost); }
    return p.length ? p.join(', ') : 'nothing';
  }
  function gainText(c) {
    var p = [];
    if (c.gain.power) { p.push('+' + c.gain.power + ' kWh'); }
    if (c.gain.ls) { p.push('+' + c.gain.ls + '% Life Support'); }
    if (c.extraGain) { p.push(c.extraGain); }
    return p.join(', ');
  }

  /* ---------- schedule: everything random is rolled once at newGame, so forecasts are true ---------- */
  function briefFlare(f) { return { cls: f.value, letter: f.letter, id: f.id, link: f.url, time: f.date }; }

  function buildSchedule(s, windowStart) {
    var T = TUNING, sch = [], sol, date, e, cand, flare, sep, cme, roll, p, i;
    var dustSol = rint(s, T.dust.earliest, T.dust.latest);
    var nFail = rint(s, T.failures.min, T.failures.max), failSols = [], failTypes = shuffle(s, ['recycler', 'panel']);
    while (failSols.length < nFail) { var x = rint(s, T.failures.earliest, T.failures.latest); if (failSols.indexOf(x) < 0) { failSols.push(x); } }
    var lastStorm = -99, stormCount = 0, pending = null, conjCount = 0;

    for (sol = 1; sol <= T.sols; sol++) {
      date = addDays(windowStart, sol - 1);
      flare = idx.flares[date] || null;
      e = { sol: sol, date: date, flare: flare ? briefFlare(flare) : null, storm: null, dust: 0, failure: null, conjunction: 0, light: lightMin(date) };

      cand = null; sep = idx.seps[date]; cme = idx.cmes[date];
      if (sep) {
        cand = { cause: 'sep', real: true, factor: 1, label: sep.value, model: isModel(sep), detector: detectorWords(sep.value), id: sep.id, link: sep.url, time: sep.date };
      } else if (cme) {
        cand = { cause: 'cme', real: true, factor: cme.glancingBlow ? T.glancingFactor : 1, glancing: cme.glancingBlow, speed: cme.value, id: cme.id, link: cme.url, time: cme.marsArrivalEstimate, launched: cme.date };
      } else if (pending) {
        cand = { cause: 'flare', real: false, factor: 1, flare: pending };
      }
      pending = null;
      if (cand && stormCount < T.stormCap && sol - lastStorm >= T.stormGap) { e.storm = cand; lastStorm = sol; stormCount++; }

      if (flare) {                                   // roll for a storm next sol (always draws, so the run stays deterministic)
        p = T.flareStormChance[flare.letter] || 0;
        roll = rnd(s);
        if (roll < p) { pending = e.flare; }
      }
      if (sol >= dustSol && sol < dustSol + T.dust.length) { e.dust = sol - dustSol + 1; }
      i = failSols.indexOf(sol);
      if (i >= 0) { e.failure = failTypes[i]; }
      if (conjRange && date >= conjRange.start && date <= conjRange.end && conjCount < T.conjunctionSols) { e.conjunction = ++conjCount; }
      sch.push(e);
    }
    return sch;
  }

  /* ---------- sol lifecycle ---------- */
  function enterSol(s, n) {
    var e;
    s.sol = n; s.phase = 'morning'; s.hand = []; s.picks = [];
    s.required = Math.max(1, TUNING.crew - s.lostActionNext);
    s.lostActionNext = 0; s.shelterToday = false;
    e = ev(s);
    if (e.dust === 1) { s.panelsClean = false; }
    if (e.failure && s.failures.indexOf(e.failure) < 0) { s.failures.push(e.failure); }
    if (s.forecast && s.forecast.sols.length && n > s.forecast.sols[s.forecast.sols.length - 1]) { s.forecast = null; }
  }

  function newGame(seed, opts) {
    opts = opts || {};
    var T = TUNING, first = data.meta.window.start, last = data.meta.window.end;
    var span = diffDays(first, last) + 1;
    var s = { v: 1, seed: seed >>> 0, rng: seed >>> 0 };
    var startOffset = opts.windowStart ? diffDays(first, opts.windowStart) : rint(s, 0, span - T.sols);
    if (startOffset < 0 || startOffset > span - T.sols) { throw new Error('windowStart outside the archive'); }
    s.windowStart = addDays(first, startOffset); s.windowOpt = opts.windowStart || null;
    s.level = TUNING.levels[opts.level] ? opts.level : 'commander';
    s.schedule = buildSchedule(s, s.windowStart);
    s.ls = T.start.ls; s.power = T.start.power; s.shield = T.start.shield;
    s.stars = 0; s.harvests = 0;
    s.roofBuilt = false; s.wallArmed = false; s.panelsClean = false; s.shelterToday = false;
    s.lostActionNext = 0; s.failures = []; s.forbushLeft = 0; s.bonusDue = 0; s.bonusNext = 0;
    s.labCount = 0; s.stormsHit = 0; s.totalDose = 0;
    s.forecast = null; s.log = []; s.history = []; s.lastSunset = null; s.result = null;
    enterSol(s, 1);
    return s;
  }

  function eligible(s, c) { return c.ok ? c.ok(s) : true; }

  function startPlan(state) {
    if (state.phase !== 'morning') { throw new Error('startPlan: phase is ' + state.phase); }
    // each sol deals from its own shuffle of the whole deck, so a swapped choice in the debrief replay cannot change later luck
    var s = clone(state), deal = { rng: ((s.seed ^ Math.imul(s.sol, 0x9E3779B1)) + 0x7F4A7C15) >>> 0 };
    var order = shuffle(deal, CARDS.filter(function (c) { return c.id !== 'shelter'; })).filter(function (c) { return eligible(s, c); });
    var must = eligible(s, byId.shelter) ? [byId.shelter] : [];                     // [T] Storm shelter is always dealt on storm days
    s.hand = shuffle(deal, must.concat(order).slice(0, TUNING.handSize)).map(function (c) { return c.id; });
    s.phase = 'plan';
    return s;
  }

  function blockReason(s, c) {
    if (c.id === 'call' && ev(s).conjunction) { return 'Mars is behind the Sun, so no signal gets through'; }
    return null;
  }
  function afterCard(s, c) {
    return {
      ls: Math.min(TUNING.max.ls, s.ls - (c.cost.ls || 0) + (c.gain.ls || 0)),
      power: Math.min(TUNING.max.power, s.power - (c.cost.power || 0) + (c.gain.power || 0))
    };
  }
  function affordReason(s, c) {
    var a = afterCard(s, c);
    if (a.power <= 0) { return 'Not enough power'; }
    if (a.ls <= 0) { return 'Not enough Life Support'; }
    return null;
  }

  function canPlay(state, id) {
    var c = byId[id];
    if (!c) { return { ok: false, reason: 'Unknown card' }; }
    if (state.phase !== 'plan') { return { ok: false, reason: 'Not planning right now' }; }
    if (state.hand.indexOf(id) < 0) { return { ok: false, reason: 'Not in your hand' }; }
    if (state.picks.indexOf(id) >= 0) { return { ok: false, reason: 'Already played' }; }
    var b = blockReason(state, c);
    if (b) { return { ok: false, reason: b }; }
    var a = affordReason(state, c);
    if (!a) { return { ok: true }; }
    var alt = state.hand.some(function (h) {
      return h !== id && state.picks.indexOf(h) < 0 && !blockReason(state, byId[h]) && !affordReason(state, byId[h]);
    });
    return alt ? { ok: false, reason: a } : { ok: true, forced: true };   // no safe choice left: allowed, the mission may end
  }

  function playCard(state, id) {
    var chk = canPlay(state, id);
    if (!chk.ok) { throw new Error('playCard(' + id + '): ' + chk.reason); }
    var s = clone(state), c = byId[id], a = afterCard(s, c), out;
    s.ls = Math.max(0, a.ls); s.power = Math.max(0, a.power);   // a forced play can empty a bar, never go below 0
    out = c.fx ? c.fx(s) : null;
    if (typeof out === 'string') { out = { text: out }; }
    s.picks.push(id);
    s.log.push({ sol: s.sol, text: c.name + ': ' + (out ? out.text : 'done.'), url: out && out.url ? out.url : '', tip: out && out.tip ? out.tip : '',
                 source: out && out.url ? { name: out.name || '', url: out.url, retrieved: out.retrieved || '', live: false, note: out.note || '' } : null });
    var left = s.hand.filter(function (h) { return s.picks.indexOf(h) < 0 && !blockReason(s, byId[h]); });
    if (s.picks.length >= s.required || left.length === 0) { s.phase = 'sunsetReady'; }
    return s;
  }

  function projectedStormHit(state) {
    var e = ev(state);
    if (!e.storm) { return 0; }
    var m = TUNING.stormMult;
    return r2(TUNING.stormHit * e.storm.factor * (state.roofBuilt ? m.roof : 1) * (state.shelterToday ? m.shelter : 1) * (state.wallArmed ? m.wall : 1));
  }

  function endSol(state) {
    if (state.phase !== 'sunsetReady') { throw new Error('endSol: phase is ' + state.phase); }

  function evItem(it, future) {
    var kids = [icb(it.icon, 'ic'), h('div', {}, [
      h('div', { class: 'ttl' }, [h('span', { text: it.title }), h('span', { class: 'pill ' + (it.real ? 'real' : 'game'), str: !it.real ? 'Game event' : it.source && it.source.live ? 'Real NASA data · live' : 'Real NASA data · saved' })]),
      h('div', { text: it.text }),
      it.hit && !future ? h('div', { class: 'hit', str: 'Right now this storm would cost your Shield ' + E.projectedStormHit(state) + ' mSv.' }) : null,
      whence(it.source, it.stamp)])];
    return h('div', { class: 'ev ' + it.kind }, kids);
  }
  function reportPanel() {
    var items = E.report(state), kids = [h('h2', { str: 'Morning report' })], enter = fxNow && fxNow.newSol;
    if (state.lastSunset && state.sol > 1) {
      var L = state.lastSunset;
      kids.push(h('div', { class: 'lastsun' }, [h('span', { class: 'dim', str: 'Last sunset:' }),
        h('span', { class: 'd' }, withIc('air', sign(L.dLs) + '%')), h('span', { class: 'd' }, withIc('bolt', sign(L.dPower) + ' kWh')), h('span', { class: 'd' }, withIc('shield', sign(L.dShield) + ' mSv'))]));
      if (L.notes.length) { kids.push(h('p', { class: 'dim', text: L.notes.join('. ') + '.' })); }
    }
    if (!items.length) { kids.push(h('p', { str: 'A quiet morning. Nothing special in the sky today.' })); }
    items.forEach(function (it, n) { var el = evItem(it); el.style.setProperty('--i', n); kids.push(el); });
    var fc = E.forecast(state);
    if (fc.length) {
      kids.push(h('h2', {}, [icb('dish'), ' Message from Earth']));
      fc.forEach(function (f) {
        kids.push(h('p', { text: 'Sol ' + f.sol + ' (real date ' + f.date + '):' }));
        if (!f.items.length) { kids.push(h('p', { class: 'dim', str: 'Quiet day.' })); }
        f.items.forEach(function (it) { kids.push(evItem(it, true)); });
      });
    }
    return h('div', { class: 'panel' + (enter ? ' enter' : '') }, kids);
  }

  /* ---- cards ---- */
  function cardEl(v) {
    var kids = [
      h('div', { class: 'head' }, [icb(v.icon, 'cico'), h('div', { class: 'name', str: v.name })]),
      h('div', { text: v.text }),
      h('div', { class: 'ln cost' }, [h('b', { str: 'Costs: ' }), h('span', { text: v.costText })]),
      v.gainText ? h('div', { class: 'ln gain' }, [h('b', { str: 'Gives: ' }), h('span', { text: v.gainText })]) : null,
      v.anchor ? h('div', { class: 'anchor' }, [h('span', { text: v.anchor.text }), whence(v.anchor.source)]) : null,
      v.reason ? h('div', { class: 'why' }, withIc('warn', v.reason)) : null,
      h('button', { disabled: v.played || !v.canPlay, onclick: function () { act(function (s) { return E.playCard(s, v.id); }); }, }, v.played ? ['Played ', ic('check')] : ['Play this card'])
    ];
    return h('div', { class: 'card' + (v.played ? ' played' : '') + (fxNow && fxNow.played === v.id ? ' justplayed' : '') }, kids);
  }
  function logPanel() {
    var mine = state.log.filter(function (l) { return l.sol === state.sol; });
    if (!mine.length) { return null; }
    return h('div', { class: 'panel log' }, mine.map(function (l) { return h('div', {}, [h('p', { text: l.text }), whence(l.source)]); }));
  }
  function footer() {
    return h('footer', { class: 'dim' }, [h('p', {}, [badge()]), h('p', { text: DATA.meta.notLive }), h('p', { str: DATA.meta.credit }),
      h('p', { str: 'Costs, power numbers and chances are game numbers, not real measurements.' }),
      h('p', {}, [h('button', { class: 'link', onclick: openSources, str: 'Data sources: every dataset and link' })])]);
  }

  function jezeroLine() {                // real Perseverance MEDA temperatures (saved copy)
    var j = D.mars.jezero.sol43to44;
    return h('div', {}, [h('p', { str: 'Outside it is freezing. Perseverance measured ' + String(j.high.value).replace('-', '−') + ' °C by day and ' + String(j.low.value).replace('-', '−') + ' °C at night at Jezero.' }),
      whence({ name: j.high.source, url: j.high.url, retrieved: j.high.retrieved, live: false, note: 'Real: NASA\'s first weather report from Jezero crater (Perseverance MEDA), sols 43 to 44, April 2021.' })]);
  }

  /* ---- debrief chart: the three bars, sol by sol (numbers only go into the svg) ---- */
  var LINE = { ls: '#1d9bf0', power: '#b07800', shield: '#7447ff' };
  function missionChart() {
    var nw = narrowView(), fs = nw ? 26 : 20, Hs = state.history, n = Hs.length, W = nw ? 620 : 1000, Ht = nw ? 440 : 380, L = nw ? 58 : 64, R = nw ? 170 : 190, Tp = 46, B = 48, pw = W - L - R, ph = Ht - Tp - B, out = '', keys = ['ls', 'power', 'shield'], ends = [], i, k, y;
    function X(i) { return L + (n ? i / n : 0) * pw; }
    function Y(p) { return Tp + (1 - p / 100) * ph; }
    function pct(v, k) { return Math.max(0, Math.min(100, v / T.max[k] * 100)); }
    out += '<rect x="' + L + '" y="' + Y(T.warn.danger * 100) + '" width="' + pw + '" height="' + (Y(0) - Y(T.warn.danger * 100)) + '" fill="#ffe0e1"/>';
    for (i = 0; i < n; i++) { if (Hs[i].dust) { out += '<rect x="' + X(i) + '" y="' + Tp + '" width="' + (X(i + 1) - X(i)) + '" height="' + ph + '" fill="#eadcc8"/>'; } }
    [0, 50, 100].forEach(function (g) { out += '<line x1="' + L + '" x2="' + (L + pw) + '" y1="' + Y(g) + '" y2="' + Y(g) + '" stroke="#c6d3ee" stroke-width="2"/><text x="' + (L - 10) + '" y="' + (Y(g) + 7) + '" text-anchor="end" font-size="' + fs + '">' + g + '%</text>'; });
    for (i = 0; i <= n; i += nw ? 10 : 5) { out += '<text x="' + X(i) + '" y="' + (Ht - 14) + '" text-anchor="middle" font-size="' + fs + '">' + (i === 0 ? 'Start' : 'Sol ' + i) + '</text>'; }
    for (i = 0; i < n; i++) { if (Hs[i].storm) { out += '<line x1="' + X(i + 1) + '" x2="' + X(i + 1) + '" y1="' + Tp + '" y2="' + (Tp + ph) + '" stroke="#e0262d" stroke-width="2" stroke-dasharray="6 6"/><text x="' + X(i + 1) + '" y="' + (Tp - 12) + '" text-anchor="middle" font-size="26"></text><g transform="translate(' + (X(i + 1) - 14) + ' ' + (Tp - 40) + ') scale(1.17)" fill="none" stroke="#e0262d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + ICONS.storm + '</g>'; } }
    keys.forEach(function (k) {
      var pts = [X(0) + ',' + Y(pct(T.start[k], k))];
      for (i = 0; i < n; i++) { pts.push(X(i + 1) + ',' + Y(pct(Hs[i][k], k))); }
      out += '<polyline points="' + pts.join(' ') + '" class="draw" pathLength="1" fill="none" stroke="' + LINE[k] + '" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>';
      ends.push({ k: k, y: Y(pct(state[k], k)) });
    });
    ends.sort(function (a, b) { return a.y - b.y; });
    for (i = 1; i < ends.length; i++) { if (ends[i].y - ends[i - 1].y < 30) { ends[i].y = ends[i - 1].y + 30; } }
    ends.forEach(function (e) {
      var v = state[e.k], lab = e.k === 'ls' ? Math.round(v) + '%' : e.k === 'power' ? Math.round(v) + ' kWh' : (Math.round(v * 10) / 10) + ' mSv', isz = nw ? 30 : 26;
      out += '<g transform="translate(' + (L + pw + 10) + ' ' + (e.y - isz / 2) + ') scale(' + isz / 24 + ')" fill="none" stroke="' + LINE[e.k] + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color:' + LINE[e.k] + '">' + ICONS[e.k === 'ls' ? 'air' : e.k === 'power' ? 'bolt' : 'shield'] + '</g>';
      out += '<text x="' + (L + pw + 16 + isz) + '" y="' + (e.y + 8) + '" font-size="' + (nw ? 28 : 24) + '" font-weight="800" fill="' + LINE[e.k] + '">' + lab + '</text>';
    });
    var box = h('div', { role: 'img', 'aria-label': 'Line chart of your three bars over ' + n + ' sols. At the end: Life Support ' + Math.round(state.ls) + '%, Power ' + Math.round(state.power) + ' kWh, Shield ' + (Math.round(state.shield * 10) / 10) + ' mSv. Particle storms: ' + state.stormsHit + '.' });
    box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + Ht + '" xmlns="http://www.w3.org/2000/svg" focusable="false" style="font-family:inherit" fill="#17224d">' + out + '</svg>';
    return h('div', { class: 'panel chart' }, [h('h2', { str: 'Your mission, sol by sol' }), box,
      h('p', { class: 'dim' }, ['Each line shows a bar as a share of full. ', ic('storm'), ' red dashes = particle storm. Brown band = dust storm. Pink band = danger zone.'])]);
  }

  /* ---- screens ---- */
  function startScreen() {
    return h('div', {}, [
      heroStage(),
      wordsHolder,
      h('div', { class: 'panel' }, [
        h('h2', { str: 'Your mission' }),
        h('p', { text: 'You and a crewmate live at Jezero crater on Mars. Keep the base alive for 30 sols.' }),
        jezeroLine(),
        h('ol', { class: 'steps' }, [h('li', { str: 'Read the morning report.' }), h('li', { str: 'Pick 2 of your 3 cards.' }), h('li', { str: 'Press sunset. The base uses air, power and Shield.' })]),
        h('p', { str: 'Every card costs something. There is no free safe choice!' })
      ]),
      h('div', { class: 'panel' }, [
        h('h2', { str: 'How to win' }),
        h('p', { text: 'Reach sol 30 with all bars above 0.' }),
        h('p', {}, ['Also collect ', icb('star', 'sm'), ' 3 science stars and ', icb('sprout', 'sm'), ' 5 harvests.']),
        h('p', { text: 'Shield is how much radiation dose your crew can still take. It is counted in mSv.' }),
        h('p', { text: DATA.meta.mode === 'live' ? 'The space weather is real. This game replays the last 30 days of NASA data.' : 'The space weather is real. Every game replays 30 days of NASA data.' }),
        h('p', {}, [badge()])
      ]),
      h('div', { class: 'panel' }, [h('div', { class: 'rankhead' }, [h('h2', { str: 'Pick your rank' }), soundBtn()]), h('div', { class: 'ranks' }, [
        rankBtn('cadet', 'astronaut', 'Cadet', 'Start here. Air lasts longer.'),
        rankBtn('commander', 'rocket', 'Commander', 'The full challenge. Air runs out faster.')])]),
      footer()
    ]);
  }

  function gameScreen() {
    var e = state.schedule[state.sol - 1], g = E.hint(state), act2 = [];
    if (state.phase === 'morning') {
      act2.push(h('button', { class: 'big', onclick: function () { act(E.startPlan); }, str: 'Plan the sol' }));
    } else {
      var left = state.required - state.picks.length;
      act2.push(h('h2', { class: 'pick', str: state.phase === 'plan' ? 'Pick ' + left + ' card' + (left > 1 ? 's' : '') + '. No skipping!' : 'Cards played. Ready for sunset!' }));
      act2.push(h('div', { class: 'cards' + (fxNow && fxNow.dealt ? ' deal' : '') }, E.cardViews(state).map(function (v, n) { var c = cardEl(v); c.style.setProperty('--i', n); return c; })));
      act2.push(logPanel());
      if (state.phase === 'sunsetReady') { act2.push(h('button', { class: 'big', onclick: function () { act(E.endSol); }, }, [ic('sunset'), ' Sunset: end the sol'])); }
    }
    return h('div', {}, [
      h('div', { class: 'top' }, [
        h('div', { class: 'sol', text: 'Sol ' + state.sol + ' of ' + T.sols }),
        h('span', { class: 'rankchip' }, state.level === 'cadet' ? withIc('astronaut', 'Cadet') : withIc('rocket', 'Commander')),
        h('span', { class: 'tools' }, [helpBtn(), soundBtn()]),
        h('div', { class: 'dim', str: 'Real NASA day ' + e.date + (DATA.meta.mode === 'live' ? ' (last 30 days)' : ' (archive, not live)') })
      ]),
      h('div', { class: 'solbar', 'aria-hidden': 'true' }, [h('i', { style: 'width:' + (state.sol - 1) / T.sols * 100 + '%' })]),
      hud(true), goalsRow(), stage(g.mood, g.text), wordsHolder,
      h('div', { class: 'play' }, [h('div', {}, [reportPanel()]), h('div', { class: 'act' }, act2)]),
      footer()
    ]);
  }

  function debriefOnce() {
    if (debriefFor !== state) { debriefFor = state; try { debriefData = E.debrief(state); } catch (err) { debriefData = null; } }
    return debriefData;
  }
  function endScreen() {
    var won = state.result.outcome === 'won', stars = [], g = E.hint(state), d = debriefOnce(), i;
    stars = [0, 1, 2].map(function (n) { return ic(n < state.result.rating ? 'star' : 'starOff', 'st' + (n < state.result.rating ? ' on' : '')); });
    var left = [], right = [];
    if (d) {
      left.push(h('h2', { str: '3 choices that mattered most' }));
      if (!d.decisions.length) { left.push(h('p', { str: 'This mission was too short to compare choices.' })); }
      d.decisions.forEach(function (x) {
        left.push(h('div', { class: 'dec ' + x.tone }, [
          h('div', { class: 'verdict' }, x.tone === 'good' ? withIc('check', 'This choice helped') : withIc('repeat', 'Try the other card')),
          h('div', { class: 'dt' }, [h('b', {}, ['Sol ' + x.sol + ': ', icb(x.icon, 'sm'), ' ' + x.name]), h('div', { class: 'dim' }, ['instead of ', ic(x.otherIcon), ' ' + x.otherName])]),
          h('p', { text: x.text })]));
      });
      left.push(h('div', { class: 'panel' }, [h('h2', {}, [icb('astronaut'), ' A real astronaut fact']), h('p', { text: d.fact.text }),
        h('p', { class: 'dim', str: 'From NASA OSDR study ' + d.fact.studyId + '. Who: ' + d.fact.subject + '.' }), whence(d.fact.source)]));
      right.push(h('h2', { str: 'What the real NASA data showed' }));
      d.real.forEach(function (r) { right.push(h('div', { class: 'rd' }, [icb(r.icon, 'ic'), h('div', {}, [h('div', { text: r.text }), whence(r.source)])])); });
      right.push(h('p', { class: 'dim', text: DATA.meta.mode === 'live' ? 'Space weather: fetched live, replayed as game days.' : 'Space weather: archived copy. Replayed, not live.' }));
      right.push(guide(won ? 'happy' : 'calm', d.tip));
    }
    return h('div', { class: 'end ' + (won ? 'win' : 'lose') }, [
      h('div', { class: 'hero' }, [h('div', { class: 'ttl' }, [h('h1', {}, won ? [icb('trophy', 'logo'), 'Mission complete!'] : [icb('rocket', 'logo'), 'Mission ended']), won ? h('p', { class: 'stars', role: 'img', 'aria-label': state.result.rating + ' of 3 stars' }, stars) : null]), guide(g.mood, g.text, true)]),
      wordsHolder,
      h('div', { class: 'panel' }, [h('p', { text: E.resultText(state) }),
        won && state.result.rating < 3 ? h('p', { class: 'dim', str: 'Keep at least ' + T.goals.shieldFor3Stars + ' mSv of Shield for 3 stars.' }) : null]),
      h('div', { class: 'stats' }, [
        h('div', { class: 'stat' }, [h('b', { str: String(state.history.length) }), h('span', { text: 'sols you lasted' })]),
        h('div', { class: 'stat' }, [h('b', {}, [state.stars + ' ', icb('star', 'sm')]), h('span', { str: 'science stars' })]),
        h('div', { class: 'stat' }, [h('b', {}, [state.harvests + ' ', icb('sprout', 'sm')]), h('span', { str: 'harvests' })]),
        h('div', { class: 'stat' }, [h('b', { str: state.totalDose + ' mSv' }), h('span', { text: 'radiation dose' })])
      ]),
      missionChart(),
      h('div', { class: 'deb' }, [h('div', {}, left), h('div', {}, right)]),
      h('button', { class: 'big', onclick: start, str: 'Play again as ' + (state.level === 'cadet' ? 'Cadet' : 'Commander') }),
      h('button', { class: 'quiet', onclick: function () { markShown(); screen = 'start'; render(); window.scrollTo(0, 0); }, str: 'Change rank' }),
      footer()
    ]);
  }

  function sourcesScreen() {
    var live = DATA.meta.mode === 'live', win = DATA.meta.window, c = DATA.counts, feedKids;
    if (feed === 'checking') {
      feedKids = [h('p', { str: 'Still asking NASA for the last ' + D.live.days + ' days of space weather...' })];
    } else if (live) {
      feedKids = [h('p', { str: 'Your browser asked NASA DONKI on ' + DATA.meta.fetched + ' for ' + win.start + ' to ' + win.end + '.' }),
        h('p', { text: 'It got ' + c.flares + ' flares, ' + c.cmes + ' CMEs and ' + c.seps + ' particle events.' }),
        h('p', { str: 'These are the three requests:' }),
        h('ul', { class: 'feedurls' }, ['FLR', 'CME', 'SEP'].map(function (k) { var u = D.live.urlFor(k, win); return h('li', {}, [link(u, u)]); }))];
    } else {
      feedKids = [h('p', { str: 'The live request failed, or you are offline.' }), h('p', { str: 'The game uses the saved NASA DONKI copy.' }),
        h('p', { text: 'It has ' + c.flares + ' flares, ' + c.cmes + ' CMEs and ' + c.seps + ' particle events.' }), h('p', { str: 'They cover ' + win.start + ' to ' + win.end + '.' })];
    }
    var kids = [
      h('h1', { str: 'Data sources' }),
      h('button', { class: 'quiet', onclick: function () { screen = backTo; render(); window.scrollTo(0, 0); }, }, withIc('back', 'Back')),
      h('div', { class: 'panel' }, [h('h2', { str: 'Space weather right now' }), h('p', {}, [badge()])].concat(feedKids)),
      h('p', { class: 'dim', str: 'Everything below is a saved copy from ' + D.meta.retrieved + '. Only the space weather above can be LIVE.' }),
      h('p', { class: 'dim', str: 'Costs, power numbers and chances are game numbers.' })
    ];
    D.datasets.forEach(function (d) {
      kids.push(h('div', { class: 'panel ds' }, [
        h('h2', { str: d.title }),
        h('p', { text: d.kid }),
        h('p', { class: 'dim', text: 'Used for: ' + d.usedFor }),
        h('p', { class: 'dim', str: d.feed && live ? 'Fetched live on ' + DATA.meta.fetched + '.' : 'Saved copy (archive), retrieved ' + D.meta.retrieved + '. Not live.' }),
        h('ul', {}, d.links.map(function (l) { return h('li', {}, [link(l.url, l.name)]); }))
      ]));
    });
    return h('div', {}, kids);
  }

  var lastScreen = null, lastNarrow = null;
  function render() {
    fxNow = fx; fx = null;
    found = []; wordsHolder = h('div', {});
    app.textContent = '';
    var root = screen === 'start' ? startScreen() : screen === 'end' ? endScreen() : screen === 'sources' ? sourcesScreen() : gameScreen();
    if (screen !== lastScreen) { root.classList.add('screen-in'); lastScreen = screen; }
    lastNarrow = narrowView();
    app.appendChild(root);
    if (screen !== 'sources') { var wp = wordsPanel(); if (wp) { wordsHolder.appendChild(wp); } } else { shownWords = []; }
    runFx(fxNow);
  }
  window.addEventListener('resize', function () {          // phone <-> wide: redraw the scene and chart for the new size
    clearTimeout(window.__o30rs);
    window.__o30rs = setTimeout(function () { if (lastNarrow !== null && narrowView() !== lastNarrow && !document.querySelector('.dusk')) { render(); } }, 200);
  });
  loadLive().then(function (live) {
    try {
      if (live) { var eng = createEngine(live); DATA = live; E = eng; T = E.TUNING; feed = 'live'; } else { feed = 'archive'; }
    } catch (err) { feed = 'archive'; }
    if (screen === 'start' || screen === 'sources') { render(); }
  });
  render();
})();
</script>
</body>
</html>
